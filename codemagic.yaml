workflows:
  ios-unsigned:
    name: Build unsigned ipa
    instance_type: mac_mini_m1
    max_build_duration: 60
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
    environment:
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install XcodeGen
        script: |
          brew install xcodegen
      - name: Generate Xcode project
        script: |
          xcodegen generate
      - name: Build app (unsigned)
        script: |
          xcodebuild -project AirportWidget.xcodeproj \
            -scheme AirportWidget \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build
      - name: Package ipa
        script: |
          mkdir -p out/Payload
          cp -R build/Build/Products/Release-iphoneos/AirportWidget.app out/Payload/
          cd out && zip -qry AirportWidget.ipa Payload
    artifacts:
      - out/AirportWidget.ipa
